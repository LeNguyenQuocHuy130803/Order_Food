spring.application.name=backend_Ecom

## MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:Order_Food}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## JPA/Hibernate Configuration (Development)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

## JWT Configuration (Default dev secret provided if JWT_SECRET env var is unset)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:2160000000}

## Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

## File Upload Configuration
app.file.max-size=${FILE_MAX_SIZE:5242880}
app.file.allowed-types=${FILE_ALLOWED_TYPES:image/jpeg,image/png,image/gif,image/webp}
app.upload.folder=${UPLOAD_FOLDER:blogs}
app.upload.max-retries=${UPLOAD_MAX_RETRIES:3}

## Email Configuration (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:noreply@foodfresh.com}

# PAYPAL SANDBOX CONFIGURATION
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.secret=${PAYPAL_SECRET:}
paypal.api=https://api-m.sandbox.paypal.com
paypal.return-url=${PAYPAL_RETURN_URL:http://localhost:3000/payment/success}
paypal.cancel-url=${PAYPAL_CANCEL_URL:http://localhost:3000/payment/cancel}
payment.vnd-usd-rate=${VND_USD_RATE:25000}